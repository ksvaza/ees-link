name: CI Pipeline
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup JDK14 for build
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Cache
        uses: actions/cache@v5
        id: cache
        with:
          path: .cache
          key: gomodcache

      - name: Build
        run: ant build

      - name: Publish artefacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: bin
          path: bin

      - name: Debug
        run: |
          tree
          env
          echo "${{ secrets.GITHUB_TOKEN }}"

      - name: Publish reports
        uses: uhafner/quality-monitor@v3
        with:
          pr-number: ${{ steps.pr.outputs.number }}
          config: >
            {
              "tests": {
                "tools": [{
                  "id": "junit",
                  "name": "Unit tests",
                  "pattern": "./bin/tests.xml"
                }]
              },
              "coverage": [
                {
                  "tools": [{
                    "id": "cobertura",
                    "metric": "line",
                    "sourcePath": ".",
                    "pattern": ".bin/coverage.xml"
                  }]
                }
              ],
              "analysis": [
                {
                  "name": "Linter",
                  "id": "style",
                  "tools": [{
                    "id": "golangci-lint",
                    "sourcePath": ".",
                    "pattern": "./bin/linter.txt"
                  }]
                }
              ],
            } 
