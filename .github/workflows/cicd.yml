name: CI Pipeline
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup JDK 14
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
      - run: ant build
      - name: Publish artefacts
        uses: actions/upload-artifact@v2
        with:
          name: image
          path: bin/ees-link.tar
