name: CI Pipeline
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup JDK 14
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - uses: docker/setup-buildx-action@v4
        id: setup-buildx
      - name: Cache
        uses: actions/cache@v5
        id: cache
        with:
          path: cache-mount
          key: gomodcache
      - name: inject cache into docker
        uses: reproducible-containers/buildkit-cache-dance/inject@v1.0.1
        with:
          cache-source: cache-mount
          cache-target: /go/pkg/mod
#      - name: Restore Cache
#        uses: reproducible-containers/buildkit-cache-dance@v3
#        with:
#          builder: ${{ steps.setup-buildx.outputs.name }}
#          cache-map: |
#            {
#              "gomodcache": "/go/pkg/mod"
#            }
#          cache-dir: cache-mount
#          dockerfile: Dockerfile
#          skip-extraction: ${{ steps.cache.outputs.cache-hit }}
      
      - name: Build
        run: ant build

      - name: extract cache from docker
        uses: reproducible-containers/buildkit-cache-dance/extract@v1.0.1
        with:
          cache-source: cache-mount
          cache-target: /go/pkg/mod

      - name: Publish artefacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: bin
          path: bin

      - name: Debug
        run: |
          tree

